<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>snitchr.sh | Observe. Detect. Alert.</title>
    <meta
      name="description"
      content="Self-hosted Linux server monitoring. One bash script watches file integrity, auth logs, resources, and open ports. Deploys in under a minute. Free and open source."
    />
    <meta property="og:title" content="babushka.sh | Observe. Detect. Alert." />
    <meta
      property="og:description"
      content="Self-hosted security monitoring for Linux servers. One bash script. Zero dependencies. Deploys in 60 seconds."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://babushka.sh" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/oat-glassed@0.2.2/oat-glassed.min.css" />
    <style>
      html {
        scroll-behavior: smooth;
      }

      /* ═══════════════════════════════════════════
         Mobile-first base styles (< 641px)
         ═══════════════════════════════════════════ */

      /* ── Nav ── */
      .landing-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        font-size: var(--text-8);
        transition:
          background 0.3s,
          border-color 0.3s;
        border-bottom: 1px solid transparent;
      }
      .landing-nav.scrolled {
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom-color: var(--border);
      }
      .nav-brand {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--foreground);
        text-decoration: none;
        letter-spacing: -0.02em;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .nav-links a {
        color: var(--muted-foreground);
        text-decoration: none;
        transition: color 0.2s;
      }
      .nav-links a:hover {
        color: var(--foreground);
      }
      .nav-links a:not([role='button']) {
        display: none;
      }
      .nav-links a[role='button'] {
        font-size: 0.78rem;
        padding: 0.35rem 0.9rem;
      }

      /* ── Hero ── */
      .hero {
        position: relative;
        height: 100vh;
        min-height: 550px;
        overflow: hidden;
        background: #000;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 12vh 1rem 0;
      }
      #globe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }
      .globe-aura {
        position: absolute;
        bottom: -5%;
        left: 50%;
        transform: translateX(-50%);
        width: 50vh;
        height: 50vh;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 170, 204, 0.1) 0%, rgba(0, 170, 204, 0.03) 40%, transparent 60%);
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.5s ease-out;
      }
      .globe-aura.visible {
        animation: globe-aura-pulse 5s ease-in-out infinite;
      }
      .babushka-aura {
        position: absolute;
        top: 16%;
        left: 50%;
        transform: translateX(-50%);
        width: 28vh;
        height: 28vh;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 170, 204, 0.18) 0%, rgba(0, 170, 204, 0.05) 35%, transparent 60%);
        z-index: 3;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.5s ease-out;
      }
      .babushka-aura.visible {
        animation: aura-pulse 4s ease-in-out infinite;
      }
      .babushka-peek {
        position: absolute;
        top: 16%;
        left: 50%;
        transform: translateX(-50%) scale(0.97);
        height: 45vh;
        max-height: 560px;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        mask-image: radial-gradient(ellipse at 50% 22%, black 20%, transparent 50%);
        -webkit-mask-image: radial-gradient(ellipse at 50% 22%, black 20%, transparent 50%);
        animation: babushka-enter 3s ease-out 0.4s forwards;
      }
      .hero-fade {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 35%;
        background: linear-gradient(transparent, var(--background));
        pointer-events: none;
        z-index: 5;
      }
      .hero-content {
        position: relative;
        z-index: 10;
        text-align: center;
        max-width: 760px;
        padding: 0.5rem;
      }
      .hero-label {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--success);
        margin: 0 0 1rem;
        opacity: 0.75;
      }
      .hero h1 {
        font-family: var(--font-mono);
        font-size: clamp(2.2rem, 8vw, 4.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        margin: 0;
        line-height: 1.05;
        color: var(--foreground);
        text-shadow:
          0 0 80px rgba(0, 170, 204, 0.15),
          0 2px 30px rgba(0, 0, 0, 0.6);
      }
      .hero .tagline {
        font-size: clamp(0.95rem, 2.8vw, 1.3rem);
        color: var(--muted-foreground);
        margin: 1rem 0 0.5rem;
        font-weight: 400;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
      }
      .hero .sub {
        font-size: var(--text-8);
        color: var(--faint-foreground);
        max-width: 440px;
        margin: 0 auto 1.8rem;
        line-height: 1.65;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
      }
      .hero-actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .scroll-hint {
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        color: var(--faint-foreground);
        font-size: 1.2rem;
        animation: bounce 2.5s ease-in-out infinite;
        text-decoration: none;
      }

      /* ── Shared sections ── */
      .landing-section {
        padding: 3.5rem 1rem;
        max-width: 960px;
        margin: 0 auto;
      }
      .landing-section h2 {
        text-align: center;
        font-size: clamp(1.3rem, 4vw, 2rem);
        letter-spacing: -0.03em;
        margin: 0 0 0.4rem;
      }
      .section-sub {
        text-align: center;
        color: var(--muted-foreground);
        font-size: var(--text-7);
        margin: 0 0 2.5rem;
      }

      /* ── Feature grid ── */
      .feature-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .feature-grid article {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .feature-grid article:hover {
        transform: translateY(-4px);
        box-shadow: 0 0 30px rgba(0, 170, 204, 0.06);
      }
      .feature-grid h3 {
        font-size: 0.95rem;
        margin: 0 0 0.3rem;
        letter-spacing: -0.01em;
      }
      .feature-grid p {
        font-size: var(--text-8);
        color: var(--muted-foreground);
        margin: 0;
        line-height: 1.55;
      }

      /* ── Terminal ── */
      .terminal {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--border);
        border-radius: var(--radius-medium);
        margin: 2rem auto 0;
        max-width: 620px;
        text-align: left;
        font-family: var(--font-mono);
        overflow: hidden;
        backdrop-filter: blur(12px);
      }
      .terminal-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.03);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .terminal-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .terminal-dot:nth-child(1) {
        background: #ef4444;
        opacity: 0.7;
      }
      .terminal-dot:nth-child(2) {
        background: #eab308;
        opacity: 0.7;
      }
      .terminal-dot:nth-child(3) {
        background: #22c55e;
        opacity: 0.7;
      }
      .terminal-body {
        padding: 0.8rem 1rem;
        font-size: 0.72rem;
        line-height: 1.7;
        color: var(--foreground);
        min-height: 170px;
        overflow-x: auto;
      }
      .terminal-body .prompt {
        color: var(--success);
      }
      .terminal-body .output {
        color: var(--faint-foreground);
      }
      .cursor {
        display: inline-block;
        width: 7px;
        height: 1.1em;
        background: var(--foreground);
        vertical-align: text-bottom;
        margin-left: 1px;
        animation: blink 1s step-end infinite;
      }

      /* ── Steps ── */
      .steps {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
        counter-reset: step;
      }
      .step {
        text-align: center;
        counter-increment: step;
      }
      .step::before {
        content: counter(step);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.8rem;
        height: 2.8rem;
        border-radius: var(--radius-full);
        background: rgba(0, 170, 204, 0.08);
        border: 1px solid rgba(0, 170, 204, 0.2);
        font-family: var(--font-mono);
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: rgba(0, 170, 204, 0.8);
      }
      .step h3 {
        font-size: 1rem;
        margin: 0 0 0.35rem;
      }
      .step p {
        font-size: var(--text-8);
        color: var(--muted-foreground);
        margin: 0;
        line-height: 1.55;
      }

      /* ── Platforms ── */
      .platform-grid {
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
      }
      .platform-group h3 {
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--faint-foreground);
        margin: 0 0 0.8rem;
      }
      .integration-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
      }
      .integration-item {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.45rem 0.7rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-medium);
        font-size: 0.75rem;
        color: var(--muted-foreground);
        transition:
          border-color 0.2s,
          color 0.2s,
          transform 0.2s;
      }
      .integration-item:hover {
        border-color: rgba(0, 170, 204, 0.3);
        color: var(--foreground);
        transform: translateY(-2px);
      }
      .integration-item img,
      .integration-item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .integration-item.coming {
        opacity: 0.4;
        border-style: dashed;
      }
      .integration-item .soon {
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.6;
      }
      .integration-badge {
        font-size: 0.55rem;
        padding: 0.1rem 0.3rem;
        background: rgba(0, 170, 204, 0.1);
        border: 1px solid rgba(0, 170, 204, 0.2);
        border-radius: var(--radius-full);
        color: rgba(0, 170, 204, 0.8);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      /* ── Tech pills ── */
      .tech-pills {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.55rem;
      }
      .tech-pills .badge {
        font-size: 0.72rem;
        letter-spacing: 0.02em;
      }

      /* ── Why card ── */
      .why-card {
        max-width: 560px;
        margin: 2rem auto 0;
        text-align: left;
      }
      .why-card h3 {
        margin-top: 0;
      }
      .why-card p {
        color: var(--muted-foreground);
        margin: 0;
        line-height: 1.65;
      }

      /* ── Newsletter ── */
      .newsletter-wrap {
        max-width: 480px;
        margin: 0 auto;
        text-align: center;
      }
      .newsletter-form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin: 0 auto 0.8rem;
      }
      .newsletter-form input[type='email'] {
        flex: 1;
        min-width: 0;
      }
      .newsletter-form button {
        flex-shrink: 0;
        white-space: nowrap;
        width: 100%;
      }
      .form-note {
        font-size: 0.72rem;
        color: var(--faint-foreground);
        margin: 0;
        line-height: 1.5;
      }
      .newsletter-ok {
        color: var(--success);
        font-size: var(--text-8);
        margin: 0.5rem 0 0;
      }

      /* ── CTA ── */
      .cta-section {
        text-align: center;
        padding: 3.5rem 1rem 3rem;
        max-width: 600px;
        margin: 0 auto;
      }
      .cta-section h2 {
        font-size: clamp(1.3rem, 4vw, 1.8rem);
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
      }
      .cta-section > p {
        color: var(--muted-foreground);
        margin: 0 0 1.8rem;
        line-height: 1.6;
        font-size: var(--text-7);
      }
      .cta-scale {
        margin-top: 2rem;
        font-size: 0.78rem;
        color: var(--faint-foreground);
        line-height: 1.6;
      }
      .cta-scale a {
        color: var(--muted-foreground);
      }

      /* ── Deploy button ── */
      .deploy-row {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.5rem;
      }
      .deploy-row img {
        height: 32px;
        transition: opacity 0.2s;
      }
      .deploy-row img:hover {
        opacity: 0.8;
      }

      /* ── Footer ── */
      .landing-footer {
        text-align: center;
        padding: 1.5rem 1rem;
        border-top: 1px solid var(--border);
        font-size: var(--text-8);
        color: var(--faint-foreground);
      }
      .landing-footer a {
        color: var(--muted-foreground);
      }
      .landing-footer p {
        margin: 0.3rem 0;
      }

      /* ── Divider ── */
      .glow-divider {
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 5%,
          rgba(0, 170, 204, 0.2) 30%,
          rgba(0, 170, 204, 0.2) 70%,
          transparent 95%
        );
        border: none;
        margin: 0;
      }

      /* ── Animations ── */
      @keyframes babushka-enter {
        0% {
          opacity: 0;
          transform: translateX(-50%) scale(0.96);
          filter: brightness(0.5);
        }
        100% {
          opacity: 0.28;
          transform: translateX(-50%) scale(1);
          filter: brightness(0.85) saturate(1.4);
        }
      }
      @keyframes aura-pulse {
        0%,
        100% {
          opacity: 0.6;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.18);
        }
      }
      @keyframes globe-aura-pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.12);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
          opacity: 0.4;
        }
        50% {
          transform: translateX(-50%) translateY(8px);
          opacity: 0.8;
        }
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .fade-up {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
      }
      .fade-up.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* ═══════════════════════════════════════════
         Desktop enhancements (≥ 641px)
         ═══════════════════════════════════════════ */
      @media (min-width: 641px) {
        .landing-nav {
          padding: 0.75rem 1.5rem;
        }
        .nav-links {
          gap: 1.5rem;
        }
        .nav-links a:not([role='button']) {
          display: inline;
        }

        .hero {
          padding-top: 10vh;
          min-height: 600px;
        }
        .hero-content {
          padding: 1rem;
        }
        .hero-label {
          font-size: 0.68rem;
          margin-bottom: 1.2rem;
        }
        .babushka-peek {
          height: 62vh;
          top: 13%;
        }
        .babushka-aura {
          top: 14%;
          width: 38vh;
          height: 38vh;
        }
        .globe-aura {
          width: 70vh;
          height: 70vh;
        }

        .landing-section {
          padding: 5rem 1.25rem;
        }
        .section-sub {
          margin-bottom: 3rem;
        }
        .feature-grid {
          grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        }
        .steps {
          grid-template-columns: repeat(3, 1fr);
          gap: 2.5rem;
        }

        .terminal {
          margin-top: 2.5rem;
        }
        .terminal-body {
          padding: 1rem 1.25rem;
          font-size: 0.8rem;
          min-height: 190px;
        }

        .integration-row {
          gap: 0.65rem;
        }
        .integration-item {
          gap: 0.5rem;
          padding: 0.55rem 0.95rem;
          font-size: 0.8rem;
        }
        .integration-item img,
        .integration-item svg {
          width: 20px;
          height: 20px;
        }
        .integration-badge {
          font-size: 0.58rem;
          padding: 0.1rem 0.35rem;
        }
        .integration-item .soon {
          font-size: 0.58rem;
        }

        .newsletter-form {
          flex-direction: row;
        }
        .newsletter-form button {
          width: auto;
        }

        .cta-section {
          padding: 4rem 1.25rem 3rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- ════════════════════ NAV ════════════════════ -->
    <nav class="landing-nav" aria-label="Main">
      <a href="/" class="nav-brand">snitchr.sh</a>
      <div class="nav-links">
        <a href="#features">Features</a>
        <a href="#platforms">Integrations</a>
        <a href="#how-it-works">Setup</a>
        <a role="button" class="outline" href="https://github.com/thinking-tools/snitchr">GitHub</a>
      </div>
    </nav>

    <!-- ════════════════════ HERO ════════════════════ -->
    <section class="hero">
     hello world!
    </header>


  </body>
</html>

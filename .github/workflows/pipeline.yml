name: Pipeline

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

permissions: {}

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate: format, typecheck, unit tests (~30s) ───────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt = m => m.pct + '%';
              console.log('| Metric      | Coverage |');
              console.log('|-------------|----------|');
              console.log('| Statements  | ' + fmt(c.statements) + ' |');
              console.log('| Branches    | ' + fmt(c.branches) + ' |');
              console.log('| Functions   | ' + fmt(c.functions) + ' |');
              console.log('| Lines       | ' + fmt(c.lines) + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── E2E: Bun + CF variants (~1m each, parallel) ─────────────────────
  e2e:
    name: E2E (${{ matrix.variant }} / ${{ matrix.storage }})
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: bun
            storage: filesystem
          - variant: cf
            storage: r2

    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - if: matrix.variant == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - run: npm ci

      - name: E2E tests
        run: VARIANT=${{ matrix.variant }} E2E_STORAGE_MODE=${{ matrix.storage }} bash test/e2e/run.sh

      - name: Gateway log (on failure)
        if: failure()
        run: cat /tmp/e2e_gateway.log 2>/dev/null || echo "No gateway log found"

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose -f test/e2e/docker-compose.yml logs 2>/dev/null || true

  # ── Fuzz: Schemathesis API fuzzing (~1m) ─────────────────────────────
  fuzz:
    name: Fuzz
    needs: ci
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:node

      - name: Bootstrap gateway
        id: gw
        run: |
          node dist/cli.js --port 8787 --data-dir /tmp/snitchr-fuzz &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

          timeout 30 bash -c \
            'until curl -sf http://localhost:8787/api/capabilities >/dev/null 2>&1; do sleep 1; done'

          curl -sf -X POST http://localhost:8787/api/setup \
            -H 'Content-Type: application/json' \
            -d '{"password":"fuzzpass123!","passwordConfirm":"fuzzpass123!","storageMode":"memory"}'

          SESSION=$(curl -sf -D - -X POST http://localhost:8787/api/login \
            -H 'Content-Type: application/json' \
            -d '{"password":"fuzzpass123!"}' \
            | grep -i '^set-cookie:.*session=' | sed 's/.*session=\([^;]*\).*/\1/')
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"

          TOKEN=$(curl -sf -X POST http://localhost:8787/api/install-token \
            -H "Cookie: session=$SESSION" | jq -r '.token')

          REG=$(curl -sf -X POST http://localhost:8787/register \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$TOKEN\",\"sysinfo\":{\"hostname\":\"fuzz-host\",\"os\":\"Ubuntu 22.04\"}}")
          MACHINE_ID=$(echo "$REG" | jq -r '.id')
          MACHINE_SECRET=$(echo "$REG" | jq -r '.secret')
          echo "machine_id=$MACHINE_ID" >> "$GITHUB_OUTPUT"
          echo "machine_secret=$MACHINE_SECRET" >> "$GITHUB_OUTPUT"

          NOW_MS=$(($(date +%s) * 1000))
          curl -sf -X POST "http://localhost:8787/m/$MACHINE_ID/ingest" \
            -H "Authorization: Bearer $MACHINE_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"t\":0,\"d\":{\"ts\":$NOW_MS,\"up\":3600,\"cpu\":12.5,\"mem\":[4096,8192],\"disk\":[45],\"load\":[1.2,0.8,0.6],\"procs\":142,\"net\":[1073741824,536870912],\"ports\":\"22,80\",\"users\":\"root\"}}"

          curl -sf -X POST "http://localhost:8787/m/$MACHINE_ID/ingest" \
            -H "Authorization: Bearer $MACHINE_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"t\":2,\"d\":{\"type\":\"ssh_login\",\"msg\":\"Accepted publickey for root from 10.0.0.1 port 54321\"}}"

          echo "Gateway bootstrapped (machine=$MACHINE_ID)"

      - uses: schemathesis/action@806cace2053cbbac93188e1281ff7da415643160 # v3
        with:
          schema: docs/openapi-gateway.yaml
          base-url: http://localhost:8787
          checks: all
          authorization: Bearer ${{ steps.gw.outputs.machine_secret }}
          coverage-pr-comment: 'false'
          args: >-
            -H "Cookie: session=${{ steps.gw.outputs.session }}"
            --exclude-path "/api/setup"
            --exclude-path "/api/logout"
            --exclude-path "/api/settings/reset"
            --exclude-path "/api/settings/password"
            --exclude-path "/install-agent"
            --exclude-path "/agent"
            --exclude-path "/api/login"
            --exclude-path "/api/settings/test-notification"
            --exclude-checks ignored_auth,negative_data_rejection,missing_required_header,unsupported_method
            --max-response-time 5

      - name: Stop gateway
        if: always()
        run: kill ${{ steps.gw.outputs.pid }} 2>/dev/null || true
